services:
  - type: web
    name: jeju-cruise-dashboard
    runtime: python
    plan: free
    rootDir: .2차 프로젝트/temp/dashboard
    buildCommand: pip install -r requirements.txt
    startCommand: marimo run app.py --host 0.0.0.0 --port $PORT --no-token
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
