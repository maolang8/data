name: Update dashboard data

on:
  schedule:
    # Every Monday at 08:17 KST (Sunday 23:17 UTC)
    - cron: "17 23 * * 0"
  workflow_dispatch:
  push:
    paths:
      - ".2차 프로젝트/temp/dashboard/data/raw/**"
      - ".2차 프로젝트/temp/dashboard/data/manual_cruise_updates.csv"
      - ".2차 프로젝트/temp/dashboard/scripts/**"

permissions:
  contents: write

jobs:
  rebuild-and-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ".2차 프로젝트/temp/dashboard"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ".2차 프로젝트/temp/dashboard/requirements.txt"
      - name: Install data dependencies
        run: python -m pip install pandas
      - name: Rebuild SQLite database
        run: python scripts/build_db.py
      - name: Validate database
        run: python scripts/validate_db.py
      - name: Commit refreshed database
        working-directory: ${{ github.workspace }}
        run: |
          if git diff --quiet -- ".2차 프로젝트/temp/dashboard/data/cruise_dashboard.db"; then
            echo "No database changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".2차 프로젝트/temp/dashboard/data/cruise_dashboard.db"
          git commit -m "chore: refresh dashboard database [skip ci]"
          git push
